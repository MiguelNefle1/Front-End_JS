<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Ejemplos de Flexbox</title>
</head>
<body>

  <h1>Demostración de Flexbox</h1>

  <!-- Ejemplo 1: Flex horizontal -->
  <div class="seccion">
    <div class="titulo">1. Flex horizontal (fila por defecto)</div>
    <div class="contenedor">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
  </div>

  <!-- Ejemplo 2: Flex columna -->
  <div class="seccion">
    <div class="titulo">2. Flex en columna</div>
    <div class="contenedor columna">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
    </div>
  </div>

  <!-- Ejemplo 3: Flex con gap -->
  <div class="seccion">
    <div class="titulo">3. Flex con separación (gap)</div>
    <div class="contenedor con-gap">
      <div class="item">X</div>
      <div class="item">Y</div>
      <div class="item">Z</div>
    </div>
  </div>

</body>
</html>
