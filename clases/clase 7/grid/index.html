<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Ejemplos CSS Grid Básico</title>
</head>

<body>

    <h2>1. Declaración de Grid</h2>
    <div class="grid-1">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
    </div>

    <h2>2. Uso de fr (fracciones)</h2>
    <div class="grid-2">
        <div class="item">1fr</div>
        <div class="item">2fr</div>
        <div class="item">1fr</div>
        <div class="item">2fr</div>
    </div>

    <h2>3. Uso de repeat()</h2>
    <div class="grid-3">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>4. grid-column y grid-row</h2>
    <div class="grid-4">
        <div class="item item-span">Grande</div>
        <div class="item">X</div>
        <div class="item">Y</div>
        <div class="item">Z</div>
    </div>

    <h2>5. grid-template-areas</h2>
    <div class="grid-5">
        <div class="item header">Header</div>
        <div class="item sidebar">Sidebar</div>
        <div class="item main">Main</div>
        <div class="item footer">Footer</div>
    </div>

</body>

</html>
